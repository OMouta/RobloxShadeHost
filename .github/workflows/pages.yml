name: Website

# Deploys the site when main changes it, when a release is published, edited or deleted, or when started from the
# Actions tab. Pull requests that change it only build it.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/**'
      # The download page compares the newest release with the version in CMakeLists.txt.
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'assets/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pages.yml'
  # The download buttons link to the newest release's files. A release that build.yml publishes with the workflow's
  # token doesn't start other workflows, this trigger included, so build.yml starts this workflow itself with
  # gh workflow run. This trigger covers releases published or changed by hand.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deployments run one after another. A pull request's newer build replaces its older one.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  # A release event runs on the release's tag, and the github-pages environment only deploys from the default branch,
  # so this starts the workflow again on the default branch. Only vX.Y.Z releases change the site.
  release:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the website workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --ref "$BRANCH"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.1.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # The download buttons read the newest release from the API, which allows 60 requests an hour without a
          # token. If GitHub doesn't answer, the build still succeeds and the buttons link to the Releases page.
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
